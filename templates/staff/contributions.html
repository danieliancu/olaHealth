{% extends "staff/layout.html" %}{% load ui %}
{% block staff_title %}Moderation{% endblock %}
{% block staff_content %}
<h1>Moderation queue</h1>
<form class="staff-filters" method="get" action="{% url 'staff:contributions' %}" hx-get="{% url 'staff:contributions' %}" hx-target="#staff-results" hx-push-url="true" hx-trigger="change, submit">
  <div class="field"><label for="id_status">Status</label>{{ form.status }}</div>
  <div class="field"><label for="id_problem_type">Problem</label>{{ form.problem_type }}</div>
  <div class="field"><label for="id_age">Age</label>{{ form.age }}</div>
  <button class="btn btn-outline btn-small" type="submit">Filter</button>
</form>
<div id="staff-results">{% include "staff/partials/contribution_results.html" %}</div>
{% endblock %}
