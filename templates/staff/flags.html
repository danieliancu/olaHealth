{% extends "staff/layout.html" %}{% load ui %}
{% block staff_title %}Review flags{% endblock %}
{% block staff_content %}
<h1>Review flags</h1>
<form class="staff-filters" method="get" action="{% url 'staff:flags' %}" hx-get="{% url 'staff:flags' %}" hx-target="#staff-results" hx-push-url="true" hx-trigger="change, submit">
  <div class="field"><label for="id_status">Status</label>{{ form.status }}</div>
  <div class="field"><label for="id_kind">Kind</label>{{ form.kind }}</div>
  <button class="btn btn-outline btn-small" type="submit">Filter</button>
</form>
<div id="staff-results">{% include "staff/partials/flag_results.html" %}</div>
{% endblock %}
