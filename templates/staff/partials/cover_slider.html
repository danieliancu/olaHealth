{# One photo slider of Staff → Magazine → Covers; part of the form "cover-form" #}
<div class="cover-slider">
  <label for="{{ field.auto_id }}">{{ field.label }} <output data-photo-out="{{ key }}">{{ field.value }}</output></label>
  <input type="range" name="{{ field.html_name }}" id="{{ field.auto_id }}" form="cover-form" value="{{ field.value }}" min="{{ field.field.widget.attrs.min }}" max="{{ field.field.widget.attrs.max }}" step="1" data-photo="{{ key }}" aria-describedby="{{ field.auto_id }}_help">
  <p class="hint" id="{{ field.auto_id }}_help">{{ field.help_text }}</p>
  {% for error in field.errors %}<p class="error" role="alert">{{ error }}</p>{% endfor %}
</div>
