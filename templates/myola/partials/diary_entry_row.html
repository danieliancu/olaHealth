{% load i18n ui %}{% url 'today-entry' e.pk as edit_url %}<a class="entry" href="{{ edit_url }}" hx-get="{{ edit_url }}" hx-target="#entry-{{ e.pk }}" hx-swap="innerHTML" aria-label="{% blocktranslate with name=e.name %}{{ name }}: edit{% endblocktranslate %}"><span class="entry-main"><span class="entry-name">{{ e.name }}</span><span class="entry-amount"><span class="entry-pill">{{ e.amount_display }} {{ e.unit }}</span>{% if show_energy and e.kcal_display != "–" %}<span class="entry-pill entry-kcal">{{ e.kcal_display }} kcal</span>{% endif %}</span></span>{% icon "chevron-right" 18 %}</a>
