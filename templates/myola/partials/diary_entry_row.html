{% load i18n ui %}{% url 'today-entry' e.pk as edit_url %}<a class="entry" href="{{ edit_url }}" hx-get="{{ edit_url }}" hx-target="#entry-{{ e.pk }}" hx-swap="innerHTML" aria-label="{% blocktranslate with name=e.name %}{{ name }}: edit{% endblocktranslate %}"><span class="entry-name">{{ e.name }}</span><span class="entry-amount">{{ e.amount_display }} {{ e.unit }}{% if show_energy and e.kcal_display != "–" %} · {{ e.kcal_display }} kcal{% endif %}</span>{% icon "chevron-right" 18 %}</a>
