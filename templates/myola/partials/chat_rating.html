{% load i18n ui %}<form class="chat-rate" id="chat-rate-{{ a.pk }}" method="post" action="{% url 'chat-rate' a.pk %}" hx-post="{% url 'chat-rate' a.pk %}" hx-target="this" hx-swap="outerHTML">{% csrf_token %}<button type="submit" name="value" value="up" class="chat-rate-btn" aria-pressed="{% if a.rating == 1 %}true{% else %}false{% endif %}" title="{% translate 'Helpful' %}" aria-label="{% translate 'Helpful' %}">{% icon "thumbs-up" 14 %}</button><button type="submit" name="value" value="down" class="chat-rate-btn" aria-pressed="{% if a.rating == -1 %}true{% else %}false{% endif %}" title="{% translate 'Not helpful' %}" aria-label="{% translate 'Not helpful' %}">{% icon "thumbs-down" 14 %}</button>{% if a.rating %}<span class="sr-only" role="status">{% translate "Thanks for the feedback." %}</span>{% endif %}</form>
