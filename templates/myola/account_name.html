{% extends "base.html" %}
{% load i18n ui %}
{% block title %}{% translate "Your name" %}{% endblock %}
{% block content %}
<div class="page-head">
  <h1>{% translate "Your name" %}</h1>
  <a class="icon-btn" href="{% url 'ask-foodo' %}?tab=account" aria-label="{% translate 'Back' %}" title="{% translate 'Back' %}">{% icon "x" 22 %}</a>
</div>
<form class="card stack" method="post" novalidate>
  {% csrf_token %}
  {% include "partials/form_fields.html" %}
  <button type="submit" class="btn btn-primary">{% translate "Save" %}</button>
</form>
{% endblock %}
