{% load i18n %}
<dialog class="dialog" data-note-dialog aria-labelledby="note-title">
  <form class="dialog-body" data-no-busy>
    <h2 id="note-title">{% translate "Add a note" %}</h2>
    <p class="caption">{% blocktranslate with n=name %}About “{{ n }}”. Saved in My Ola → Notes, on this device only.{% endblocktranslate %}</p>
    <label for="note-kind">{% translate "Type" %}</label>
    <select id="note-kind" name="kind">
      <option value="taste">{% translate "Taste" %}</option>
      <option value="prefer">{% translate "Why I prefer it" %}</option>
      <option value="avoid">{% translate "Why I avoid it" %}</option>
      <option value="general">{% translate "Other" %}</option>
    </select>
    <label for="note-text">{% translate "Note" %}</label>
    <textarea id="note-text" name="text" maxlength="2000" required></textarea>
    <p class="hint">{% translate "Please don't write diagnoses, symptoms or medication here." %}</p>
    <div class="dialog-actions">
      <button type="button" class="btn" data-note-cancel>{% translate "Cancel" %}</button>
      <button type="submit" class="btn btn-primary">{% translate "Save note" %}</button>
    </div>
  </form>
</dialog>
