{% load i18n ui %}
<dialog class="dialog chat-dialog" data-chat aria-labelledby="chat-title">
  <div class="chat">
    <div class="chat-head">
      <div>
        <h2 id="chat-title">{% icon "sparkles" 20 %} {% translate "Ask Foodo" %}</h2>
        <p class="caption" data-chat-context></p>
      </div>
      <button type="button" class="icon-btn" data-chat-close aria-label="{% translate 'Close' %}">{% icon "x" 22 %}</button>
    </div>
    <p class="chat-note">{% translate "Answers use only the facts in the app and what you saved on this device. No medical advice; no guarantee about allergens." %}</p>
    <ol class="chat-log" data-chat-log></ol>
    <p class="caption" data-chat-empty>{% translate "Pick a question or type your own." %}</p>
    <div class="sr-only" aria-live="polite" data-chat-live></div>
    <div class="chat-suggest" data-chat-suggest></div>
    <form class="chat-form" data-chat-form data-no-busy>
      <label for="chat-input" class="sr-only">{% translate "Your question" %}</label>
      <input id="chat-input" type="text" maxlength="300" autocomplete="off" data-chat-input placeholder="{% translate 'Ask about this product or your lists' %}">
      <button type="submit" class="btn btn-primary btn-send" aria-label="{% translate 'Send' %}">{% icon "send" 20 %}</button>
    </form>
  </div>
</dialog>
