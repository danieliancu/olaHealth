# Development override: source mounted, Django dev server, dev dependencies installed.
#   docker compose -f compose.yaml -f compose.dev.yaml up --build
services:
  web:
    build:
      args:
        INSTALL_DEV: "true"
    image: olahealth:dev
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py createcachetable &&
             python manage.py setup_schedules &&
             python manage.py sync_taxonomies --if-empty &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_DEBUG: "1"
      POSTGRES_HOST: postgres
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
    volumes:
      - .:/app
      - private_media:/data/private
      - exports:/data/exports

  # Catches every email sent in development; inbox at http://localhost:18025
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:18025:8025"
    restart: unless-stopped

  worker:
    build:
      args:
        INSTALL_DEV: "true"
    image: olahealth:dev
    environment:
      DJANGO_DEBUG: "1"
      POSTGRES_HOST: postgres
      OMP_THREAD_LIMIT: "1"
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
    volumes:
      - .:/app
      - private_media:/data/private
      - exports:/data/exports
